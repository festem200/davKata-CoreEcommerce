services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: core_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/core_ecommerce
      ORDERS_API_KEY: local-dev-key
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
