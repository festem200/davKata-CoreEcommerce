name: Deploy Prod

# "Build once, deploy many": esta pipeline NUNCA reconstruye la imagen.
# Promueve por retag el artefacto que ya se construyó y probó en
# `integration` (tag int-latest) — es, bit a bit, el mismo binario.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  promote-and-deploy:
    name: Retag (prod-<sha> + latest) y desplegar
    runs-on: ubuntu-latest
    # Se activa solo cuando F6 ya provisionó el rol de IAM (OIDC) y el
    # registro ECR. Mientras esa variable de repositorio no exista, este
    # job se salta en vez de fallar — main puede seguir recibiendo
    # promociones sin que el pipeline reporte un error de infraestructura
    # que todavía no le corresponde a esta rama arreglar.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS (OIDC, sin secretos de larga duración)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login en ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Retag int-latest → prod-<sha> y latest (sin reconstruir)
        # Se promueve int-latest, no int-<sha del commit de merge en main>:
        # los merge commits de integration→laboratory→main cambian de sha en
        # cada salto, así que el sha de este push a main nunca coincide con
        # el sha que ci.yml usó al construir en integration.
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker pull "$REGISTRY/core-ecommerce:int-latest"
          docker tag "$REGISTRY/core-ecommerce:int-latest" "$REGISTRY/core-ecommerce:prod-${{ github.sha }}"
          docker tag "$REGISTRY/core-ecommerce:int-latest" "$REGISTRY/core-ecommerce:latest"
          docker push "$REGISTRY/core-ecommerce:prod-${{ github.sha }}"
          docker push "$REGISTRY/core-ecommerce:latest"

      - name: Desplegar en ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: core-ecommerce-prod
          image: ${{ steps.ecr-login.outputs.registry }}/core-ecommerce:prod-${{ github.sha }}
          execution-role-arn: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: 8080
          health-check-path: /health
          cpu: 256
          memory: 512
          min-task-count: 1
          max-task-count: 1
          environment-variables: |
            [{"name":"DATABASE_URL","value":"${{ secrets.DATABASE_URL }}"},{"name":"NODE_ENV","value":"production"},{"name":"ORDERS_API_KEY","value":"${{ secrets.ORDERS_API_KEY }}"}]
